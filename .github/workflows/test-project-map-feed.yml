name: Test project map feed export
on:
  pull_request:
    paths:
      - 'scripts/build_presale_project_feed.py'
      - 'tests/test_build_presale_project_feed.py'
      - 'data/project_identity_register.json'
      - 'data/approved_project_aliases.json'
      - 'data/community_mapping.csv'
      - 'scripts/build_completed_home_review.py'
      - 'scripts/build_completed_project_feed.py'
      - 'scripts/update_project_history.py'
      - 'tests/test_project_periods.py'
      - '.github/workflows/update-project-history.yml'
      - 'tests/test_build_completed_project_feed.py'
      - 'data/official_completed_project_feed.json'
      - 'tests/test_build_completed_home_review.py'
      - 'data/official_presale_project_feed.json'
      - 'data/verified_project_matches.json'
      - 'data/verified_project_price_feed.json'
      - 'analysis/verified-project-213-evidence-20261018.json'
      - 'scripts/update_market.py'
      - 'tests/test_official_project_evidence.py'
      - 'scripts/build_project_map_feed.py'
      - 'scripts/build_project_review_queue.py'
      - 'scripts/refresh_project_match_candidates.py'
      - 'tests/test_build_project_map_feed.py'
      - 'tests/test_build_project_review_queue.py'
      - 'tests/test_refresh_project_match_candidates.py'
      - '.github/workflows/update-market.yml'
      - '.github/workflows/test-project-map-feed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test official project evidence retention
        run: python -m unittest discover -s tests -p 'test_official*.py' -v
      - name: Test recurring automatic presale matching
        run: |
          python -m unittest discover -s tests -p 'test_build_presale_project_feed.py' -v
          python scripts/build_presale_project_feed.py
      - name: Test completed-home review
        run: |
          python -m unittest discover -s tests -p 'test_build_completed*.py' -v
          python -m unittest discover -s tests -p 'test_project_periods.py' -v
          python scripts/build_completed_home_review.py
          python scripts/build_completed_project_feed.py
      - name: Validate public presale contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/official_presale_project_feed.json'))
          assert d['schemaVersion']==2 and d['feedKind']=='public_official_presale'
          assert len(d['projects'])==386
          assert d['matchedPriceProjects']==sum(r['priceStatus']=='official_name_matched' for r in d['projects'])
          assert d['includedTransactionCount']==sum(r['transactionCount'] or 0 for r in d['projects'])
          for r in d['projects']:
              if r['priceStatus']=='official_name_matched':
                  assert r['registryKind']=='預售屋'
                  assert r['officialIdentityCount']==r['transactionCount']
                  assert len(r['officialLocations'])==1
              else:
                  assert all(r[k] is None for k in ('transactionCount','averageUnitPriceWanPing','minUnitPriceWanPing','maxUnitPriceWanPing'))
          print('PASS: automatic presale feed and pending masking')
          PY
      - name: Unit test scheduled transaction matching
        run: python -m unittest discover -s tests -p 'test_refresh_project_match_candidates.py' -v
      - name: Refresh candidate matches without a web download
        run: python scripts/refresh_project_match_candidates.py
      - name: Unit test verification review queue
        run: python -m unittest discover -s tests -p 'test_build_project_review_queue.py' -v
      - name: Generate verification queue
        run: python scripts/build_project_review_queue.py
      - name: Unit test public feed safety
        run: python -m unittest discover -s tests -p 'test_build_project_map_feed.py' -v
      - name: Generate preview feed
        run: python scripts/build_project_map_feed.py --output /tmp/project-map-feed.json
      - name: Assert no pending price leaked
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/project-map-feed.json'))
          assert x['totalProjects']==386
          assert x['verifiedPriceProjects']==sum(r['priceStatus']=='verified' for r in x['projects'])
          public=json.load(open('data/verified_project_price_feed.json'))
          assert public['feedKind']=='public_verified_only'
          assert public['totalProjects']==386
          assert public['verifiedPriceProjects']==x['verifiedPriceProjects']
          assert public['projects']==x['projects']
          for row in x['projects']:
              if row['priceStatus']!='verified':
                  assert all(row[f] is None for f in (
                      'transactionCount','latestTransactionDate','latestUnitPriceWanPing',
                      'averageUnitPriceWanPing','minUnitPriceWanPing','maxUnitPriceWanPing'))
          print('PASS: 386 projects; no unverified prices; verified counts consistent')
          PY

